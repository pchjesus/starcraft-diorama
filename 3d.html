  if(typeof val==='string'){src=val}else if(val&&typeof val==='object'){src=val.src||val.path||'';meta={width:val.width,height:val.height,anchorX:val.anchorX,anchorY:val.anchorY,dx:val.dx||0,dy:val.dy||0}}
  if(!src) continue; const img=await loadImageURL(base+src); nextSprites[alias]=img; nextMeta[alias]=meta;
 }
 if(Object.keys(nextSprites).length){assetState.enabled=true; assetState.sprites=nextSprites; assetState.meta=nextMeta; assetState.source='local';setAssetStatus(`LOCAL SPRITE MODE · ON (${Object.keys(nextSprites).length})`,true);syncSpriteToggle();}
}
async function tryAutoLocalPack(){
 try{const res=await fetch('./local_assets/manifest.json',{cache:'no-store'}); if(!res.ok) return; const manifest=await res.json(); await applyManifest(manifest,'./local_assets/');}
 catch(err){}
}
assetBtn.addEventListener('click',()=>assetInput.click());
assetInput.addEventListener('change',async e=>{
 const files=[...(e.target.files||[])]; if(!files.length) return; const json=files.find(f=>/manifest\.json$/i.test(f.name));
 const nextSprites={},nextMeta={};
 if(json){try{const manifest=JSON.parse(await json.text()); const entries=manifest.sprites||manifest.images||{}; for(const [raw,val] of Object.entries(entries)){ let src='',meta={}; if(typeof val==='string'){src=val}else if(val&&typeof val==='object'){src=val.src||val.path||'';meta={width:val.width,height:val.height,anchorX:val.anchorX,anchorY:val.anchorY,dx:val.dx||0,dy:val.dy||0}} const file=files.find(f=>f.webkitRelativePath.endsWith(src)||f.name===src); if(!file) continue; const alias=normalizeName(raw); const img=await loadImageURL(URL.createObjectURL(file)); nextSprites[alias]=img; nextMeta[alias]=meta; }}catch(err){console.warn(err)}}
 if(!Object.keys(nextSprites).length){ for(const file of files){ if(!file.type.startsWith('image/')) continue; const alias=normalizeName(file.name); nextSprites[alias]=await loadImageURL(URL.createObjectURL(file)); }}
 if(Object.keys(nextSprites).length){assetState.enabled=true; assetState.sprites=nextSprites; assetState.meta=nextMeta; assetState.source='local';setAssetStatus(`LOCAL SPRITE MODE · ON (${Object.keys(nextSprites).length})`,true);syncSpriteToggle();} else setAssetStatus('LOCAL SPRITE MODE · PACK NOT FOUND',false);
});
if(q.get('assets')==='1') tryAutoLocalPack();

// Kenney's Sci-Fi RTS artwork is CC0. These images load from the original
// publicly available repository at runtime and are never bundled with Blizzard assets.
// The articulated tank stays 3D so its glance/return comedy beat cannot be lost.
const CC0_ROOT='https://raw.githubusercontent.com/shorepine/kenney/main/2d/RTS%20Sci-fi/';
const cc0Pack={
  factory:CC0_ROOT+'Structure/scifiStructure_13.png',
  machine_shop:CC0_ROOT+'Structure/scifiStructure_14.png',
  armory:CC0_ROOT+'Structure/scifiStructure_07.png',
  supply_depot:CC0_ROOT+'Structure/scifiStructure_02.png',
  bunker_frame:CC0_ROOT+'Structure/scifiStructure_05.png',
  marine:CC0_ROOT+'Unit/scifiUnit_07.png',
  marine_react:CC0_ROOT+'Unit/scifiUnit_07.png',
  scv:CC0_ROOT+'Unit/scifiUnit_09.png'
};
function syncSpriteToggle(){
  spriteToggle.textContent=assetState.enabled?'그래픽: 혼합':'그래픽: 3D';
  spriteToggle.setAttribute('aria-pressed',String(assetState.enabled));
}
async function autoLoadCC0(){
  if(q.get('skin')==='0'||q.get('assets')==='0') return;
  const entries=await Promise.allSettled(Object.entries(cc0Pack).map(async([k,url])=>[k,await loadImageURL(url)]));
  const sprites=Object.fromEntries(entries.filter(x=>x.status==='fulfilled').map(x=>x.value));
  if(Object.keys(sprites).length<4){setAssetStatus('CC0 그래픽 로드 불가 · 3D 유지');return;}
  if(assetState.source==='local')return;
  assetState.sprites=sprites;assetState.meta={};assetState.source='cc0';assetState.enabled=true;
  setAssetStatus(`CC0 SCI-FI · ${Object.keys(sprites).length} ASSETS`,true);
  syncSpriteToggle();
}
spriteToggle.addEventListener('click',()=>{
  assetState.enabled=!assetState.enabled;
  if(assetState.enabled&&!Object.keys(assetState.sprites).length){autoLoadCC0()}
  else setAssetStatus(assetState.enabled?(assetState.source==='local'?'로컬 그래픽 모드':'CC0 그래픽 모드'):'순수 3D 모드',assetState.enabled);
  syncSpriteToggle();
});
if(q.get('skin')==='1')autoLoadCC0();

const btn=$('pause');function syncBtn(){btn.textContent=playing?'Ⅱ':'▶';btn.setAttribute('aria-label',playing?'일시정지':'재생');btn.title=playing?'일시정지 (Space)':'재생 (Space)'}syncBtn();
function toggle(){playing=!playing;syncBtn()}btn.addEventListener('click',toggle);addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}});
function drawGPU(rec){bindGPU(rec);gl.drawArrays(gl.TRIANGLES,0,rec.count)}
function project3(x,y,z){const v=M.v(vp,[x,y,z]);return [(v[0]/v[3]*.5+.5)*width,(1-(v[1]/v[3]*.5+.5))*height]}
const bugs=Array.from({length:42},()=>({x:rnd(-8,8),z:rnd(-8,8),y:rnd(.2,3.6),phase:rnd(0,6.28),speed:rnd(.16,.56),size:rnd(1,2.1)}));
const smoke=Array.from({length:17},(_,i)=>({p:i/17,sz:rnd(.4,1.0),drift:rnd(-.5,.5)}));
function particles(t,flash){ctx.clearRect(0,0,overlay.width,overlay.height);ctx.setTransform(ratio,0,0,ratio,0,0);
 for(let f of bugs){const p=project3(f.x+Math.sin(t*f.speed+f.phase)*.17,f.y+Math.sin(t*.9+f.phase)*.12,f.z+Math.cos(t*f.speed*.77+f.phase)*.13);let k=(1+Math.sin(t*f.speed*3+f.phase))*.5;if(k<.3)continue;ctx.fillStyle=`rgba(177,220,140,${k*.63})`;ctx.beginPath();ctx.arc(...p,f.size*k,0,Math.PI*2);ctx.fill();}
 for(const chimney of [[1.4,3.52,-3.87],[-4.21,4.25,-3.69]]){for(const s of smoke){let k=(s.p+t*.048)%1,px=chimney[0]+s.drift*k*.4,py=chimney[1]+k*2.8,pz=chimney[2]+Math.sin(k*6+s.p*9)*.19;let pt=project3(px,py,pz),radius=(4+14*k)*ratio;ctx.fillStyle=`rgba(173,187,180,${.11*(1-k)})`;ctx.beginPath();ctx.ellipse(pt[0],pt[1],radius,radius*.55,0,0,Math.PI*2);ctx.fill()}}
 const lamps=[[.55,1.1,-1.28,165,'253,168,93'],[-3.5,1.8,-2.43,105,'233,141,65'],[3.43,1.12,-1.86,80,'99,230,176']];for(let [x,y,z,r,c] of lamps){let p=project3(x,y,z),g=ctx.createRadialGradient(...p,0,...p,r);g.addColorStop(0,`rgba(${c},.23)`);g.addColorStop(.36,`rgba(${c},.045)`);g.addColorStop(1,`rgba(${c},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(...p,r,0,Math.PI*2);ctx.fill()}
 if(flash>.03){let p=project3(4.06,.53,2.35),g=ctx.createRadialGradient(...p,0,...p,26);g.addColorStop(0,`rgba(255,244,185,${flash*.88})`);g.addColorStop(1,'rgba(230,152,70,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(...p,26,0,Math.PI*2);ctx.fill();}
}
function drawSpriteFrame(key,x,y,z){const picked=pickSprite(key); if(!picked) return; const p=project3(x,y,z),meta=picked.meta,w=meta.width||120,h=meta.height||90,ax=meta.anchorX??.5,ay=meta.anchorY??.9,dx=meta.dx||0,dy=meta.dy||0; ctx.save(); ctx.imageSmoothingEnabled=false; ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=10; const screenScale=Math.min(1.25,Math.max(.33,(width/23.1)/51.9)); ctx.globalAlpha=assetState.source==='cc0'?.87:1; ctx.drawImage(picked.img,p[0]-(w*screenScale)*ax+dx*screenScale,p[1]-(h*screenScale)*ay+dy*screenScale,w*screenScale,h*screenScale); ctx.restore();}
function drawSpritePack(phase,out,react,watch){ if(!assetState.enabled) return; const tankX=.55, tankZ=-1.30+out*2.38; const entries=[
 ['armory',-3.52,2.6,-3.42],['supply_depot',-3.48,1.68,-.87],['factory',.55,3.0,-2.95],['machine_shop',3.43,2.25,-2.94],['bunker_frame',3.91,1.22,2.18],
 [react>.05&&pickSprite('marine_react')?'marine_react':'marine',-1.52,1.85,2.18],['marine',-3.15,1.82,1.45],['scv',4.05,1.0,2.28]
 ]; if(assetState.source==='local'&&phase>=7.7 && phase<29.5) entries.push([watch>.25&&pickSprite('siege_tank_look')?'siege_tank_look':'siege_tank',tankX,1.35,tankZ]); entries.sort((a,b)=>{ const da=Math.hypot(eye[0]-a[1],eye[1]-a[2],eye[2]-a[3]), db=Math.hypot(eye[0]-b[1],eye[1]-b[2],eye[2]-b[3]); return db-da;}); for(const [key,x,y,z] of entries) drawSpriteFrame(key,x,y,z); }
// The full event is deterministic. Wind, SCV and rotating fans are independent of the tank loop.
function frame(ms){if(!last)last=ms;let dt=Math.min((ms-last)*.001,.06);last=ms;if(playing)clock+=dt;let t=clock,phase=t%35;
 const out=phase<8?0:phase<14.8?S(8,14.8,phase):phase<20.8?1:phase<29.2?1-S(20.8,29.2,phase):0;
 const react=S(14.48,14.85,phase)*(1-S(16,17.55,phase)),watch=S(14.5,15.1,phase)*(1-S(25.3,27.4,phase)),angle=-.85*S(15.40,17.15,phase)*(1-S(18.5,20.45,phase));
 const dyn=new Mesh();animatedFans(dyn,t);factoryShutter(dyn,phase);marine(dyn,-1.52,2.18,t,true,react,watch);marine(dyn,-3.15,1.45,t,false,0,watch);if(phase>=7.7 && phase<29.5)tank(dyn,.55,-1.30+out*2.38,t,out,angle);scv(dyn,t);
 const d= new Float32Array(dyn.data);gl.bindBuffer(gl.ARRAY_BUFFER,dynGPU.buff);gl.bufferData(gl.ARRAY_BUFFER,d,gl.DYNAMIC_DRAW);dynGPU.count=d.length/9;
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.disable(gl.CULL_FACE);gl.clearColor(.019,.055,.073,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(program);gl.uniformMatrix4fv(vpLoc,false,new Float32Array(vp));gl.uniform3fv(camLoc,new Float32Array(eye));gl.bindVertexArray(vao);
 drawGPU(staticGPU);drawGPU(buildingGPU);drawGPU(dynGPU);
 const welding=(t%18)%6<3.9,flash=welding?(Math.sin(t*23)>0.45?1:0):0;particles(t,flash);drawSpritePack(phase,out,react,watch);$('progress').style.width=(phase/35*100)+'%';requestAnimationFrame(frame)}
requestAnimationFrame(frame);
